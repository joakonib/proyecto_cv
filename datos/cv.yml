perfil: >-
  Sociólogo y Magíster en Métodos para la Investigación Social, con más de diez años
  de experiencia en investigación social y cinco en producción estadística oficial
  en el Instituto Nacional de Estadísticas (INE). He participado en tres operaciones
  estadísticas nacionales —II ENUT (2025), Censo de Población y Vivienda 2024 y VIII EME—
  en programación de
  cuestionarios en Survey Solutions, validación y control de calidad de datos,
  construcción de bases e indicadores y elaboración de documentos técnicos.
  Antes trabajé en consultoras de estudios de opinión y de mercado. Mi herramienta
  principal es R, con la que busco desarrollar procesos y soluciones cada vez más eficientes.

